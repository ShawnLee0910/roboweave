[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roboweave"
version = "0.1.0rc5"
description = "A source-frozen, locally reviewable RoboWeave release candidate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2", "Pillow>=11,<12", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "setuptools>=68", "wheel", "opencv-python-headless==4.11.0.86", "websockets>=13,<16", "msgpack>=1,<2"]
live = ["websockets>=13,<16", "msgpack>=1,<2"]

[project.scripts]
roboweave = "roboweave.cli:main"
esi-benchmark = "roboweave.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["roboweave", "roboweave._native", "roboweave.adapters", "esi_benchmark"]
include-package-data = true

[tool.setuptools.package-data]
roboweave = ["_vendor/**/*", "data/**/*"]

[tool.setuptools.exclude-package-data]
roboweave = ["**/*.pyc", "**/*.pyo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
